services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shepherd_rm}
      POSTGRES_USER: ${POSTGRES_USER:-shepherd_rm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shepherd_rm_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - shepherd_postgres_data:/var/lib/postgresql/data

volumes:
  shepherd_postgres_data:

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "shepherd-rm"
version = "0.1.0"
description = "Resource leasing and management for people and automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.0",
    "fastapi",
    "prometheus-client>=0.23.1,<1",
    "psycopg[binary]",
    "pydantic-settings",
    "pyyaml",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]",
]

[project.scripts]
shepherd-rm = "shepherd_rm.main:run"
shepherd-rm-bootstrap-admin = "shepherd_rm.identity.bootstrap:run"
shepherd-rm-worker = "shepherd_rm.leasing.worker:run"

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typing" },
]
docs = [
    "myst-parser",
    "sphinx",
    "sphinx-rtd-theme",
]
lint = ["ruff"]
test = [
    "httpx",
    "openapi-spec-validator",
    "pytest",
    "pyyaml",
]
typing = [
    "mypy",
    "types-pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["shepherd_rm"]
mypy_path = "src"

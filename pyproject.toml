[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "shepherd-rm"
version = "0.1.0"
description = "Resource leasing and management for people and automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typing" },
]
docs = [
    "myst-parser",
    "sphinx",
    "sphinx-rtd-theme",
]
lint = ["ruff"]
test = ["pytest"]
typing = ["mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["shepherd_rm"]
mypy_path = "src"
